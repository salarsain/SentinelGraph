[project]
name = "sentinelgraph"
version = "0.1.0"
description = "AI-Powered Autonomous Web Application Security Assessment Platform"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SentinelGraph Team"},
]

dependencies = [
    # ── Web Framework ──
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.4",

    # ── Redis / Celery ──
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.3.0",

    # ── HTTP / Networking ──
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "dnspython>=2.5.0",

    # ── Browser Automation ──
    "playwright>=1.40.0",

    # ── HTML / Parsing ──
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",

    # ── Security / Crypto ──
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",

    # ── AI / Hugging Face ──
    "httpx>=0.26.0",  # Also used for HF Inference API calls

    # ── Reporting ──
    "jinja2>=3.1.0",
    "weasyprint>=60.0",

    # ── Object Storage ──
    "minio>=7.2.0",

    # ── Logging / Observability ──
    "structlog>=24.1.0",

    # ── Utilities ──
    "python-dateutil>=2.8.0",
    "orjson>=3.9.0",
    "pyyaml>=6.0.0",
    "networkx>=3.2.0",
    "mmh3>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "factory-boy>=3.3.0",
    "faker>=22.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
